# Reference copy of the rate-limiting applied to the Media Monitor nginx site
# (v2.5). The live nginx config is not tracked in this repo; this file records
# what was added so it can be re-applied after a server rebuild.
#
# Rationale: /auth/login and /webhook/run are unauthenticated entry points.
# Login is a password brute-force / credential-stuffing target; the webhook
# endpoint, even after the v2.5 O(1) key lookup, should not be hammerable.
# nginx limit_req gives us this without Redis or app changes.

# --- in the http {} block (e.g. /etc/nginx/nginx.conf or a conf.d/ snippet) ---
# A small shared-memory zone keyed by client IP. 10 MB tracks ~160k IPs.
limit_req_zone $binary_remote_addr zone=mm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mm_hook:10m rate=30r/m;
# Return 429 (not the default 503) so clients see a clear "too many requests".
limit_req_status 429;

# --- inside the server {} block for mm.schenz.eu, alongside the existing
#     "location / { proxy_pass http://127.0.0.1:8000; ... }" ---

# Brute-force protection for login. burst=5 absorbs a legitimate retry flurry;
# nodelay serves the burst immediately then throttles to the 10r/m rate.
location = /api/v1/auth/login {
    limit_req zone=mm_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location = /api/v1/webhook/run {
    limit_req zone=mm_hook burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
